# CI e agentes executam o MESMO manifesto (.harness/harness.yaml).
# O repositório está no GitHub — o bitbucket-pipelines.yml do padrão vira este workflow.
name: harness-gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 -m pip install -r scripts/requirements.txt
      - run: python3 scripts/harness-gates.py
